name: Corkline tests
on:
  push:
  workflow_dispatch:
concurrency:
  group: corkline-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: corkline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d corkline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/corkline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run migrate
      - run: npm run seed
      - run: npm test
