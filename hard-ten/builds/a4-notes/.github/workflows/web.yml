name: Web App Build
on:
  push:
  workflow_dispatch:
concurrency:
  group: web-app-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start PostgreSQL
        run: |
          docker run -d --name quillstack-test-db -e POSTGRES_PASSWORD=ghost -e POSTGRES_DB=app -p 5432:5432 postgres:17-alpine
          for i in $(seq 1 40); do docker exec quillstack-test-db pg_isready -U postgres -d app >/dev/null 2>&1 && break; sleep 1; done
          echo "DATABASE_URL=postgresql://postgres:ghost@127.0.0.1:5432/app" >> "$GITHUB_ENV"
      - name: Install
        run: npm install
      - name: Migrate
        run: npm run migrate
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
