name: Evenstep tests
on:
  push:
  workflow_dispatch:
concurrency:
  group: evenstep-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: evenstep_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d evenstep_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/evenstep_test
      REQUIRE_DATABASE_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run migrate
      - name: Test against a migrated database
        run: |
          npm run migrate
          npm test
