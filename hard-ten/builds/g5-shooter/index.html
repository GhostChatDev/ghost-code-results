<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0618">
<title>Static Bloom</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0618; color: #e8e0ff;
    font-family: system-ui, -apple-system, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; position: fixed; inset: 0; cursor: crosshair; }
  .hudbtn { position: fixed; top: 10px; width: 44px; height: 44px; border-radius: 10px; border: 1px solid #5b3fa8;
    background: rgba(30,16,60,0.7); color: #fff; font-size: 18px; cursor: pointer; }
  #muteBtn { right: 10px; }
  #pauseBtn { right: 60px; top: 58px; right: 10px; }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(8,4,20,0.72); padding: 16px; box-sizing: border-box; }
  #overlay[hidden] { display: none; }
  .card { max-width: 420px; width: 100%; text-align: center; background: rgba(25,12,52,0.92);
    border: 1px solid #6a46d0; border-radius: 16px; padding: 22px 20px; box-shadow: 0 0 40px rgba(255,80,200,0.25); }
  h1 { margin: 0 0 10px; font-size: 32px; letter-spacing: 2px;
    background: linear-gradient(90deg, #7ff9ff, #ff7ad9); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #info { margin: 0 0 16px; line-height: 1.45; font-size: 15px; color: #cfc4f2; }
  #startBtn { font-size: 18px; font-weight: 700; padding: 12px 34px; border-radius: 12px; border: 0; cursor: pointer;
    background: linear-gradient(90deg, #4de1ff, #ff5fc8); color: #12062a; min-height: 48px; }
  label { display: block; margin-top: 16px; font-size: 14px; color: #b9addf; }
  input[type=checkbox] { width: 18px; height: 18px; vertical-align: middle; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<button id="muteBtn" class="hudbtn" aria-label="Mute">🔊</button>
<button id="pauseBtn" class="hudbtn" aria-label="Pause" hidden>⏸</button>
<div id="overlay">
  <div class="card">
    <h1 id="title">Static Bloom</h1>
    <p id="info"></p>
    <button id="startBtn">Start</button>
    <label><input type="checkbox" id="reducedMotion"> Reduced motion (no screen shake or hit-stop)</label>
  </div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
