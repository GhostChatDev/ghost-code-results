const keyMap={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'jump',ArrowUp:'jump',KeyW:'jump'};
window.addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON'&&e.code==='Enter')return;if(e.code==='Space'&&mode!=='playing'&&e.target.tagName==='BUTTON')return;if(keyMap[e.code]){e.preventDefault();const k=keyMap[e.code];if(!held.has(k)&&k==='jump'&&mode==='playing')jumpPress=true;held.add(k);}if(!e.repeat&&e.code==='Escape')pause();if(!e.repeat&&e.code==='KeyR')load(index);});
window.addEventListener('keyup',e=>{if(keyMap[e.code]){e.preventDefault();held.delete(keyMap[e.code]);}});
window.addEventListener('blur',()=>{clearInput();if(mode==='playing')pause();});document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='playing')pause();});
for(const b of document.querySelectorAll('[data-control]')){b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);touch.set(e.pointerId,b.dataset.control);if(b.dataset.control==='jump'&&mode==='playing')jumpPress=true;});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,e=>touch.delete(e.pointerId));}
$('pause').onclick=()=>{if(mode!=='playing'&&mode!=='paused')mode='playing';pause();};$('restart').onclick=()=>load(index);$('levels').onclick=selectLevels;$('mute').onclick=()=>{muted=!muted;$('mute').textContent=`Sound: ${muted?'off':'on'}`;$('mute').setAttribute('aria-pressed',String(!muted));message(muted?'Sound off · explore in quiet.':'Sound on · copper chimes enabled.');tone(550);};
window.addEventListener('resize',resize);resize();load(0,false);show('Small steps.\nWild places.','An old copper companion. A world reclaimed by green. Run, leap and wall-jump through three handmade worlds. Collect gears, light checkpoint flags, and find each copper door.',[['Begin the journey',()=>load(0)],['Choose a world',selectLevels]],'AN ORIGINAL PLATFORM ADVENTURE');requestAnimationFrame(frame);
</script></body></html>
